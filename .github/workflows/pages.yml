# keeps the NHL PowerScore site current: it pulls new games from MoneyPuck, rosters, injuries and starting goalies,
# rebuilds the features, refits the model, logs this season's pregame predictions and deploys the webapp folder to GitHub Pages.
# It runs every morning, every hour through game time, on every push and on demand.
name: Deploy site
on:
  push:
    branches: [main]
  schedule:
    # 11:00 UTC = 7 AM Eastern (6 AM in winter), after the previous night's games are posted
    - cron: "0 11 * * *"
    # hourly from noon to midnight Eastern, so starting goalie confirmations and late injury news are picked up
    # (GitHub may start scheduled runs late when it is busy; the webpage also checks ESPN live for starters and scores)
    - cron: "0 16-23 * * *"
    - cron: "0 0-4 * * *"
  workflow_dispatch:
permissions:
  # contents: write lets the run save this season's prediction log back to the repo
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    # the very first run downloads every career game log (roughly 40 minutes); later runs only fetch new games
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # downloaded MoneyPuck data is kept between runs (a new cache entry is saved each run, the newest is restored)
      - uses: actions/cache@v4
        with:
          path: |
            data/gamemodel/all_teams_raw.csv
            data/gamemodel/goalie_games.csv
            data/gamemodel/skaters
            data/gamemodel/seasons
          key: moneypuck-${{ github.run_id }}
          restore-keys: moneypuck-
      - name: Update data and model
        run: python -m src.gamemodel.run --daily
        env:
          # show progress lines as they happen instead of all at the end
          PYTHONUNBUFFERED: "1"
      # the season log (pregame predictions frozen at puck drop, and results) is kept in the repo so it builds up all season
      # (the other files the build changes, like webapp/data.js, are set aside while syncing; a failure here never blocks the deploy)
      - name: Save the season prediction log
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/gamemodel/season_predictions.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update season prediction log"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4
